name: core 15

on: [ push, pull_request ]

jobs:
  tests:
    name: v15
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4' ]
        composerInstall: [ 'composerInstallHighest' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install testing system
        run: Build/Scripts/runTests.sh -t 15 -p ${{ matrix.php }} -s ${{ matrix.composerInstall }}

      - name: Lint PHP
        run: Build/Scripts/runTests.sh -t 15 -p ${{ matrix.php }} -s lint

      - name: Unit Tests
        run: Build/Scripts/runTests.sh -t 15 -p ${{ matrix.php }} -s unit

      - name: Functional Tests with sqlite
        run: Build/Scripts/runTests.sh -t 15 -p ${{ matrix.php }} -d sqlite -s functional

      - name: Functional Tests with mariadb
        run: Build/Scripts/runTests.sh -t 15 -p ${{ matrix.php }} -d mariadb -s functional

      - name: Functional Tests with mysql
        run: Build/Scripts/runTests.sh -t 15 -p ${{ matrix.php }} -d mysql -s functional

      - name: Functional Tests with postgres
        run: Build/Scripts/runTests.sh -t 15 -p ${{ matrix.php }} -d postgres -s functional
