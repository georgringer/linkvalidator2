<f:spaceless>
<h2>{headline}</h2>
<p><f:translate key="linkvalidator2.messages:mail.summary" languageKey="{language}" arguments="{total: total, page: pageTitle}" /></p>
<f:if condition="{items}">
    <table border="1" cellpadding="6" cellspacing="0" style="border-collapse: collapse;">
        <thead>
            <tr>
                <th align="left"><f:translate key="linkvalidator2.messages:mail.column.page" languageKey="{language}" /></th>
                <th align="left"><f:translate key="linkvalidator2.messages:mail.column.record" languageKey="{language}" /></th>
                <th align="left"><f:translate key="linkvalidator2.messages:mail.column.target" languageKey="{language}" /></th>
                <th align="left"><f:translate key="linkvalidator2.messages:mail.column.problem" languageKey="{language}" /></th>
                <th align="left"><f:translate key="linkvalidator2.messages:mail.column.since" languageKey="{language}" /></th>
                <th align="left"><f:translate key="linkvalidator2.messages:mail.column.edit" languageKey="{language}" /></th>
            </tr>
        </thead>
        <tbody>
            <f:for each="{items}" as="item">
                <tr>
                    <td>{item.pageTitle}</td>
                    <td>{item.recordTitle}</td>
                    <td><a href="{item.target}">{item.target}</a><f:if condition="{item.linkText}"><br>{item.linkText}</f:if></td>
                    <td>{item.errorMessage}</td>
                    <td><f:format.date format="Y-m-d">{item.firstDetected}</f:format.date></td>
                    <td><a href="{item.editUrl}"><f:translate key="linkvalidator2.messages:mail.column.edit" languageKey="{language}" /></a></td>
                </tr>
            </f:for>
        </tbody>
    </table>
    <f:if condition="{more}">
        <p><f:translate key="linkvalidator2.messages:mail.more" languageKey="{language}" arguments="{more: more}" /></p>
    </f:if>
</f:if>
<f:if condition="{hasCsv}">
    <p><f:translate key="linkvalidator2.messages:mail.attachment" languageKey="{language}" /></p>
</f:if>
<p><a href="{moduleUrl}"><f:translate key="linkvalidator2.messages:mail.openModule" languageKey="{language}" /></a></p>
</f:spaceless>
