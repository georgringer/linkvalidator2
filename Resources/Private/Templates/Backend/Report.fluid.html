<html
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <f:if condition="{pageTitle}">
        <f:then>
            <h1><f:translate key="linkvalidator2.messages:report.headlineWithPageTitle" arguments="{0: pageTitle}" /></h1>
            <div class="mb-3"
                data-linkvalidator2-check-progress
                data-label-starting="{f:translate(key: 'linkvalidator2.messages:check.starting')}"
                data-label-progress="{f:translate(key: 'linkvalidator2.messages:check.progress')}"
                data-label-cancelling="{f:translate(key: 'linkvalidator2.messages:check.cancelling')}"
                data-label-done="{f:translate(key: 'linkvalidator2.messages:check.done')}"
                data-label-done-message="{f:translate(key: 'linkvalidator2.messages:check.doneMessage')}"
                data-label-cancelled="{f:translate(key: 'linkvalidator2.messages:check.cancelled')}"
                data-label-failed="{f:translate(key: 'linkvalidator2.messages:check.failed')}"
                hidden
            >
                <typo3-backend-progress-bar value="0" max="1"></typo3-backend-progress-bar>
                <button type="button" class="btn btn-sm btn-default mt-1" data-linkvalidator2-check-cancel>
                    <f:translate key="linkvalidator2.messages:check.cancel" />
                </button>
            </div>
            <form action="{moduleUrl}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="linkvalidator2-depth" class="form-label"><f:translate key="linkvalidator2.messages:report.depth" /></label>
                        <select id="linkvalidator2-depth" name="depth" class="form-select">
                            <f:for each="{depthOptions}" key="value" as="label">
                                <option value="{value}" {f:if(condition: '{value} == {depth}', then: 'selected')}>{label}</option>
                            </f:for>
                        </select>
                    </div>
                    <f:render partial="FilterSelect" arguments="{name: 'status', options: filterOptions.status}" />
                    <f:render partial="FilterSelect" arguments="{name: 'linkType', options: filterOptions.linkType}" />
                    <f:render partial="FilterSelect" arguments="{name: 'table', options: filterOptions.table}" />
                    <f:render partial="FilterSelect" arguments="{name: 'language', options: filterOptions.language}" />
                    <div class="form-group">
                        <label for="linkvalidator2-filter-search" class="form-label"><f:translate key="linkvalidator2.messages:filter.search" /></label>
                        <input type="search" id="linkvalidator2-filter-search" name="search" value="{filter.search}" class="form-control">
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-default"><f:translate key="linkvalidator2.messages:filter.submit" /></button>
                        <f:if condition="{filter.active}">
                            <a href="{resetFilterUrl}" class="btn btn-link"><f:translate key="linkvalidator2.messages:filter.reset" /></a>
                        </f:if>
                    </div>
                </div>
            </form>
            <f:if condition="{brokenLinks}">
                <f:then>
                    <f:render partial="Pagination" arguments="{pagination: pagination, pageUid: pageUid}" />
                    <div class="table-fit mt-3">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <f:for each="{columns}" as="column">
                                        <th>
                                            <a href="{column.url}" class="text-nowrap">
                                                {column.label}
                                                <f:if condition="{column.active}">
                                                    <core:icon identifier="{f:if(condition: column.descending, then: 'actions-sort-amount-down', else: 'actions-sort-amount-up')}" />
                                                </f:if>
                                            </a>
                                        </th>
                                    </f:for>
                                </tr>
                            </thead>
                            <tbody>
                                <f:for each="{brokenLinks}" as="brokenLink">
                                    <tr>
                                        <td>{brokenLink.pageTitle}<br><small>{brokenLink.pid}</small></td>
                                        <td>
                                            <a href="{brokenLink.editUrl}">{brokenLink.recordTitle}</a>
                                            <br><small>{brokenLink.table_name}:{brokenLink.record_uid}</small>
                                        </td>
                                        <td>{brokenLink.field}</td>
                                        <td>{brokenLink.link_text}</td>
                                        <td>
                                            <f:if condition="{brokenLink.targetUrl}">
                                                <f:then><a href="{brokenLink.targetUrl}" target="_blank" rel="noopener noreferrer"><code>{brokenLink.link_string}</code></a></f:then>
                                                <f:else><code>{brokenLink.link_string}</code></f:else>
                                            </f:if>
                                        </td>
                                        <td>
                                            <span class="badge {brokenLink.statusClass}"><f:translate key="linkvalidator2.messages:status.{brokenLink.status}" /></span>
                                            <f:translate key="linkvalidator2.messages:error.{brokenLink.error_type}" arguments="{brokenLink.messageArguments}" default="{brokenLink.error_type}" />
                                        </td>
                                        <td><f:format.date format="d.m.Y H:i">{brokenLink.first_detected}</f:format.date></td>
                                    </tr>
                                </f:for>
                            </tbody>
                        </table>
                    </div>
                    <f:render partial="Pagination" arguments="{pagination: pagination, pageUid: pageUid}" />
                </f:then>
                <f:else>
                    <p class="mt-3"><f:translate key="{f:if(condition: filter.active, then: 'linkvalidator2.messages:report.emptyFiltered', else: 'linkvalidator2.messages:report.empty')}" /></p>
                </f:else>
            </f:if>
        </f:then>
        <f:else>
            <h1><f:translate key="linkvalidator2.messages:report.headline" /></h1>
            <p><f:translate key="linkvalidator2.messages:report.selectPage" /></p>
        </f:else>
    </f:if>
</f:section>

</html>
