<html
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Widget/Widget" />

<f:section name="main">
    <f:switch expression="{state}">
        <f:case value="noModule">
            <p><f:translate key="linkvalidator2.widget:state.noModule" /></p>
        </f:case>
        <f:case value="noPage">
            <p><f:translate key="linkvalidator2.widget:state.noPage" /></p>
        </f:case>
        <f:case value="noAccess">
            <p><f:translate key="linkvalidator2.widget:state.noAccess" /></p>
        </f:case>
        <f:defaultCase>
            <f:if condition="{rows}">
                <f:then>
                    <p>
                        <f:translate key="linkvalidator2.widget:summary" arguments="{0: total, 1: pagesWithBrokenLinks, 2: pageTitle}" />
                    </p>
                    <div class="widget-table-wrapper">
                        <table class="widget-table table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th><f:translate key="linkvalidator2.widget:column.page" /></th>
                                    <th class="text-end"><f:translate key="linkvalidator2.widget:column.amount" /></th>
                                </tr>
                            </thead>
                            <tbody>
                                <f:for each="{rows}" as="row">
                                    <tr>
                                        <td>
                                            <core:iconForRecord table="pages" row="{row.record}" />
                                            <a href="{row.url}">{row.title}</a>
                                        </td>
                                        <td class="text-end"><span class="badge badge-danger">{row.amount}</span></td>
                                    </tr>
                                </f:for>
                            </tbody>
                        </table>
                    </div>
                    <f:if condition="{moreCount}">
                        <p class="text-body-secondary mt-2">
                            <f:translate key="linkvalidator2.widget:more" arguments="{0: moreCount}" />
                        </p>
                    </f:if>
                </f:then>
                <f:else>
                    <p><f:translate key="linkvalidator2.widget:empty" arguments="{0: pageTitle}" /></p>
                </f:else>
            </f:if>
        </f:defaultCase>
    </f:switch>
</f:section>

<f:section name="footer">
    <f:if condition="{state} == 'list'">
        <a href="{reportUrl}" class="widget-cta btn btn-default">
            <f:translate key="linkvalidator2.widget:openReport" />
        </a>
    </f:if>
</f:section>

</html>
