<html
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:if condition="{pagination.numberOfPages} > 1">
    <nav class="pagination-wrap">
        <ul class="pagination">
            <f:if condition="{pagination.previousPage}">
                <f:then>
                    <li class="page-item">
                        <a href="{f:be.uri(route: 'linkvalidator2_report', parameters: '{id: pageUid, page: 1}')}" title="{f:translate(extensionName: 'fluid', key: 'widget.pagination.first')}" class="page-link">
                            <core:icon identifier="actions-view-paging-first" />
                        </a>
                    </li>
                    <li class="page-item">
                        <a href="{f:be.uri(route: 'linkvalidator2_report', parameters: '{id: pageUid, page: pagination.previousPage}')}" title="{f:translate(extensionName: 'fluid', key: 'widget.pagination.previous')}" class="page-link">
                            <core:icon identifier="actions-view-paging-previous" />
                        </a>
                    </li>
                </f:then>
                <f:else>
                    <li class="page-item disabled"><span class="page-link"><core:icon identifier="empty-empty" /></span></li>
                    <li class="page-item disabled"><span class="page-link"><core:icon identifier="empty-empty" /></span></li>
                </f:else>
            </f:if>
            <li class="page-item">
                <span class="page-link">
                    <f:translate key="linkvalidator2.messages:pagination.records" arguments="{0: pagination.startRecord, 1: pagination.endRecord, 2: pagination.total}" />
                </span>
            </li>
            <f:if condition="{pagination.nextPage}">
                <f:then>
                    <li class="page-item">
                        <a href="{f:be.uri(route: 'linkvalidator2_report', parameters: '{id: pageUid, page: pagination.nextPage}')}" title="{f:translate(extensionName: 'fluid', key: 'widget.pagination.next')}" class="page-link">
                            <core:icon identifier="actions-view-paging-next" />
                        </a>
                    </li>
                    <li class="page-item">
                        <a href="{f:be.uri(route: 'linkvalidator2_report', parameters: '{id: pageUid, page: pagination.numberOfPages}')}" title="{f:translate(extensionName: 'fluid', key: 'widget.pagination.last')}" class="page-link">
                            <core:icon identifier="actions-view-paging-last" />
                        </a>
                    </li>
                </f:then>
                <f:else>
                    <li class="page-item disabled"><span class="page-link"><core:icon identifier="empty-empty" /></span></li>
                    <li class="page-item disabled"><span class="page-link"><core:icon identifier="empty-empty" /></span></li>
                </f:else>
            </f:if>
        </ul>
    </nav>
</f:if>
</html>
