services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  _instanceof:
    TYPO3\CMS\Linkvalidator2\Check\LinkCheckerInterface:
      tags: ['linkvalidator2.checker']

  TYPO3\CMS\Linkvalidator2\:
    resource: '../Classes/*'

  TYPO3\CMS\Linkvalidator2\Check\CheckerRegistry:
    arguments:
      $checkers: !tagged_iterator linkvalidator2.checker
