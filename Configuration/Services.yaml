services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  GeorgRinger\Linkvalidator2\:
    resource: '../Classes/*'

  GeorgRinger\Linkvalidator2\Check\CheckerRegistry:
    arguments:
      $checkers: !tagged_iterator linkvalidator2.checker

  GeorgRinger\Linkvalidator2\Exclusion\ExclusionMatcher:
    arguments:
      $matchers: !tagged_iterator linkvalidator2.exclusion_matcher

  # Instantiated by the DataHandler through GeneralUtility::makeInstance()
  GeorgRinger\Linkvalidator2\Hook\DataHandlerHook:
    public: true

  # Transport for records that became due, a worker consumes it before the regular one:
  # messenger:consume linkvalidator2_priority doctrine
  linkvalidator2.transport.priority:
    class: Symfony\Component\Messenger\Bridge\Doctrine\Transport\DoctrineTransport
    factory: ['@TYPO3\CMS\Core\Messenger\DoctrineTransportFactory', 'createTransport']
    arguments:
      $options:
        queue_name: 'linkvalidator2_priority'
    tags:
      - name: 'messenger.sender'
        identifier: 'linkvalidator2_priority'
      - name: 'messenger.receiver'
        identifier: 'linkvalidator2_priority'
