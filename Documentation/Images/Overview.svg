<rect x="800" y="33" width="164" height="64" rx="6"/>
<rect x="800" y="183" width="164" height="64" rx="6"/>
<rect x="800" y="333" width="164" height="64" rx="6"/>
</g>
<g fill="#f3ecdc" stroke="#9a7a2c" stroke-width="1.3"><rect x="580" y="450" width="384" height="48" rx="6"/></g>
<g fill="none" stroke="#1b2123" stroke-width="1.4">
<polyline points="206,65 250,65" marker-end="url(#arr)"/>
<polyline points="520,65 580,65" marker-end="url(#arr)"/>
<polyline points="206,165 250,165" marker-end="url(#arr)"/>
<polyline points="520,165 580,165" marker-end="url(#arr)"/>
<polyline points="206,265 250,265" marker-end="url(#arr)"/>
<polyline points="520,265 580,265" marker-end="url(#arr)"/>
<polyline points="206,365 250,365" marker-end="url(#arr)"/>
