<rect x="16" y="33" width="190" height="64" rx="6"/>
<rect x="250" y="33" width="270" height="64" rx="6"/>
<rect x="16" y="133" width="190" height="64" rx="6"/>
<rect x="250" y="133" width="270" height="64" rx="6"/>
