<g fill="#1b2123" text-anchor="middle">
<text x="111" y="61" font-weight="600">Backend module</text><text x="111" y="78">button "Check links"</text>
<text x="385" y="61" font-weight="600">CheckController (AJAX)</text><text x="385" y="78">page by page, time budget</text>
<text x="111" y="161" font-weight="600">CLI</text><text x="111" y="178">linkvalidator2:check</text>
<text x="385" y="161" font-weight="600">CheckCommand</text><text x="385" y="178">page tree in batches</text>
<text x="111" y="261" font-weight="600">Cron</text><text x="111" y="278">fillqueue, messenger:consume</text>
<text x="385" y="261" font-weight="600">QueueFiller, Messenger</text><text x="385" y="278">25 records per message, workers</text>
<text x="111" y="361" font-weight="600">Saving in the backend</text><text x="111" y="378">DataHandler</text>
<text x="385" y="361" font-weight="600">DataHandlerHook</text><text x="385" y="378">stored results, due queue</text>
<text x="665" y="213" font-weight="600">RecordCheckService</text><text x="665" y="231">checkRecord(table, uid)</text>
<text x="882" y="61" font-weight="600">target</text><text x="882" y="78">one result per target</text>
<text x="882" y="211" font-weight="600">broken_link</text><text x="882" y="228">places with a problem</text>
<text x="882" y="361" font-weight="600">record_status</text><text x="882" y="378">checked or due</text>
<text x="772" y="479" font-weight="600">Report, mail, widget, RTE markers</text>
